# Git hooks, installed by `lefthook install`.
commit-msg:
  jobs:
    # A Claude Code session link must not reach the history. {1} is the path
    # of the message file; quoted, because it may hold a space.
    - name: no session link
      run: |
        if grep -qE 'claude\.ai/code/session_[A-Za-z0-9]' "{1}"; then
          echo "commit message contains a Claude Code session link (claude.ai/code/session_…)" >&2
          exit 1
        fi
