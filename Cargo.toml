[workspace]
members = ["crates/*"]
resolver = "3"

# Shared metadata. Every crate inherits these so that the MSRV and the edition are one fact, not eleven.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://bitbucket.org/kravlad86/keepster"

# Every member is declared here, including the ones still empty, so a crate that starts depending on
# another writes `keepster-x.workspace = true` and the path lives in exactly one place. The version
# accompanies the path because a bare path dependency has no version requirement, which the dependency
# gate counts — correctly — as unpinned.
[workspace.dependencies]
keepster-api = { path = "crates/keepster-api", version = "0.1.0" }
keepster-app = { path = "crates/keepster-app", version = "0.1.0" }
keepster-cli = { path = "crates/keepster-cli", version = "0.1.0" }
keepster-core = { path = "crates/keepster-core", version = "0.1.0" }
keepster-daemon = { path = "crates/keepster-daemon", version = "0.1.0" }
keepster-service = { path = "crates/keepster-service", version = "0.1.0" }
keepster-store = { path = "crates/keepster-store", version = "0.1.0" }
keepster-testkit = { path = "crates/keepster-testkit", version = "0.1.0" }
keepster-tray = { path = "crates/keepster-tray", version = "0.1.0" }
keepster-ui = { path = "crates/keepster-ui", version = "0.1.0" }
keepster-watch = { path = "crates/keepster-watch", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
