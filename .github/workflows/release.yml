# The release (ticket 85, first part): a `v*` tag builds an archive per documented target (ticket 27) and
# publishes them with their checksums as a GitHub release. Run by hand, it builds the same archives as run
# artifacts and publishes nothing, which is how a change here is tried before a tag depends on it.
#
# Every archive holds both binaries side by side, because `keepster install` looks for the tray next to
# itself and one package carries both (ticket 27). Each target builds on its own platform: macOS binaries
# must be built on macOS (ticket 27), and Linux is static musl, which is clean since git2 lost its
# networking features. The install scripts, `install.sh` and `install.ps1`, go into the release with the
# version written into them, so each installs the release it came with, and are first run against the
# archives just built. The Homebrew tap, deb and rpm, and the release-time gates (the smoke test, the
# bench tripwire) are still ticket 85's open work.
#
# Hand-written rather than generated by `dist`: `dist` would make one app of each of the two packages that
# build the binaries, and would take its release host from `repository`, which names the canonical remote
# rather than this copy.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: archive for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Every leg reads the same version, so whichever leg's output stands is the one.
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      # The ARM image is not guaranteed to carry a Rust toolchain the way the others do.
      - name: Install rustup if the image has none
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Add the target
        run: rustup target add "$TARGET"
      - name: The version, and a tag that names it
        id: version
        run: |
          # `path+file:///…/keepster-daemon#0.1.0`; the part after `#` would read `name@0.1.0` if the
          # package were ever renamed away from its directory.
          id=$(cargo pkgid --locked -p keepster-daemon)
          version=${id##*[#@]}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name the workspace version $version"
            exit 1
          fi
      # libgit2 and SQLite are C, so a musl build needs a C compiler for musl. The cc crate would look for
      # `aarch64-linux-musl-gcc` on ARM, a name musl-tools does not install, so both targets name it.
      - name: Install the musl C compiler
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build both binaries
        run: cargo build --release --locked --target "$TARGET" -p keepster-daemon -p keepster-tray
      - name: Pack the archive
        run: |
          dir="keepster-$VERSION-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/keepster$EXE" "target/$TARGET/release/keepster-tray$EXE" LICENSE "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "$dir.zip" "$dir"
          else
            tar -cJf "$dir.tar.xz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: keepster-${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error

  assemble:
    name: the install scripts and the checksums
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # Each script names its release on the one line left empty for it, and the run fails if that line
      # is not there to be written.
      - name: The install scripts, naming this release
        run: |
          sed "s/^release_version=''\$/release_version='$VERSION'/" scripts/install.sh > dist/install.sh
          sed "s/^    \$ReleaseVersion = ''\$/    \$ReleaseVersion = '$VERSION'/" scripts/install.ps1 > dist/install.ps1
          grep -qx "release_version='$VERSION'" dist/install.sh
          grep -qx "    \$ReleaseVersion = '$VERSION'" dist/install.ps1
      - name: Checksums
        working-directory: dist
        run: sha256sum keepster-* install.sh install.ps1 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Each script installs its own release, with no version given, from the files about to be published,
  # and refuses an archive that does not match SHA256SUMS. `keepster install` runs for real, on the
  # runner's own service manager.
  installers:
    name: the install script on ${{ matrix.os }}
    needs: [build, assemble]
    runs-on: ${{ matrix.os }}
    # An install takes well under a minute; a run far past that is waiting on something it started.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: install.sh installs this release
        if: runner.os != 'Windows'
        run: |
          KEEPSTER_BASE_URL="file://$PWD/dist" KEEPSTER_INSTALL_DIR="$RUNNER_TEMP/keepster" sh dist/install.sh
          test -x "$RUNNER_TEMP/keepster/keepster-tray"
          test "$("$RUNNER_TEMP/keepster/keepster" --version)" = "keepster $VERSION"
      - name: install.sh refuses an archive that does not match its checksum
        if: runner.os != 'Windows'
        run: |
          cp -R dist tampered
          for archive in tampered/keepster-*.tar.xz; do printf x >> "$archive"; done
          if KEEPSTER_BASE_URL="file://$PWD/tampered" KEEPSTER_INSTALL_DIR="$RUNNER_TEMP/refused" \
            sh dist/install.sh; then
            echo "::error::install.sh installed a tampered archive"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/refused"
      - name: install.ps1 installs this release
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:KEEPSTER_BASE_URL = ([Uri] (Resolve-Path dist).Path).AbsoluteUri
          $env:KEEPSTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'keepster'
          powershell -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:KEEPSTER_INSTALL_DIR 'keepster-tray.exe'))) { throw 'no keepster-tray.exe' }
          $version = & (Join-Path $env:KEEPSTER_INSTALL_DIR 'keepster.exe') --version
          if ($version -ne "keepster $env:VERSION") { throw "keepster --version says: $version" }
      - name: install.ps1 refuses an archive that does not match its checksum
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item -Recurse dist tampered
          Get-ChildItem tampered\keepster-*.zip | ForEach-Object { Add-Content -Path $_.FullName -Value 'x' }
          $env:KEEPSTER_BASE_URL = ([Uri] (Resolve-Path tampered).Path).AbsoluteUri
          $env:KEEPSTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'refused'
          powershell -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 installed a tampered archive' }
          if (Test-Path $env:KEEPSTER_INSTALL_DIR) { throw "$env:KEEPSTER_INSTALL_DIR was created" }
          exit 0

  release:
    name: the release
    needs: installers
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Keepster $GITHUB_REF_NAME" --verify-tag --generate-notes
