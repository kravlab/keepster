# The merge gate: every check here has a verdict that is a property of the diff rather than of the
# machine (ticket 32). Anything whose verdict depends on a machine, a browser or a place — the
# performance tripwire, the browser smoke test, the platform table, the outcome-budget review — runs at
# release time instead, and the advisory database check runs on a schedule. The platform table, the
# watcher conformance report and the coverage report run in `reports.yml`.
#
# The copy is private, so minutes are budgeted. The gate runs on pull requests only: every change
# reaches `main` through one, so a run on the merged commit would repeat the pull request's. Whatever
# reaches `main` without one, `nightly.yml` covers on macOS. A change that touches nothing but tickets
# and documentation runs nothing at all.
#
# CI lives on GitHub while the canonical remote is Bitbucket, so release tags must reach this copy or
# the API compatibility gate compares against the wrong baseline.

name: merge gate

on:
  pull_request:
    paths-ignore:
      - ".scratch/**"
      - "docs/**"
      - "**.md"

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lints:
    name: format, lints and the dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup component add rustfmt clippy
      # Dependencies only: the workspace's own crates are rebuilt every time. Never saved here: a pull
      # request's cache is its own, and saving each would fill the repository's 10 GB. What is restored
      # is whatever an earlier run on `main` left.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Every other cargo call enables every feature, so the build without the embedded web UI (ticket 24)
      # would otherwise never compile here. No `--all-targets`: the tests' harness depends on the daemon with
      # its default features, which would switch the web UI back on.
      - name: The daemon builds without the web UI
        run: cargo clippy -p keepster-daemon --no-default-features --locked -- -D warnings
      - name: shellcheck on the install scripts
        run: shellcheck scripts/install.sh scripts/test-install.sh
      - name: The CLI must link no store dependency and no server stack
        # Ticket 08 turns "the UI must not own persistence contracts" into a build fact; this is the
        # check for it, and it is cheap enough to run on every change. Ticket 40 adds the schema
        # generator and the server: `keepster-api`'s `openapi` feature is the daemon's alone.
        run: |
          forbidden='git2|rusqlite|keepster-store|keepster-core|utoipa|axum'
          if cargo tree --locked -p keepster-cli --prefix none --no-dedupe \
            | grep -Eq "^($forbidden) "; then
            echo "keepster-cli must not depend on the store, the domain core or the server stack" >&2
            cargo tree --locked -p keepster-cli --prefix none | grep -E "^($forbidden) " >&2
            exit 1
          fi

  tests:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Line tables only: a failing test still says where, and the debug information every test binary
    # carries — which Windows writes out as a PDB per binary — shrinks to a fraction.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Every failing test binary is reported, not only the first: a platform's failures are read in
      # one run rather than one per push. No `--all-targets`: the workspace has no examples, and its one
      # bench, the tripwire (ticket 69), measures rather than tests: `make bench` runs it, and the lints
      # job checks it, on Linux. Without it the doc tests run in this one invocation, under the same
      # features, rather than in a second one that rebuilds crates for a feature set of its own.
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  # The install scripts (ticket 85) against a faked release, each on the platforms it serves.
  installers:
    name: the install scripts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The tests take seconds; a run far past that is an installer waiting on something it started.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: scripts/test-install.sh
      # macOS runs `sh` as bash, which reads a piped script differently from Ubuntu's dash; this leg
      # runs on every change, macOS's on pull requests only.
      - name: install.sh under bash
        if: runner.os == 'Linux'
        run: INSTALLER_SHELL=bash scripts/test-install.sh
      # Windows PowerShell 5.1, the one every Windows has: the tests compile their stub with its Add-Type.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-install.ps1

  contract:
    name: the /v1 contract is additive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is the last release tag, so the history and its tags must be here.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # The drift test also runs in every `tests` leg; it is run here by name so that this job's verdict
      # covers the whole contract, and a stale document is reported as such rather than as a test failure
      # among many.
      - name: The committed openapi.json is the generated one
        run: cargo test --locked -p keepster-daemon --test daemon openapi::the_committed_document_is_the_generated_one
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@v1.31.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Vacuous, and annotated as such, until a release tag exists (ticket 40).
      - name: Compatible with the last release
        run: make check-api

  msrv:
    name: the declared MSRV builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the floor from the workspace manifest
        id: msrv
        run: |
          floor=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
      - name: Install that toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.floor }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Check, not test — a floor is about compiling
        run: cargo +${{ steps.msrv.outputs.floor }} check --workspace --all-features --locked

  licences:
    name: licences and bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}
      - name: Install cargo-deny if it is not cached
        run: command -v cargo-deny || cargo install --locked cargo-deny
      # Licences and bans only: ticket 32 puts the advisory database on a schedule, because its verdict
      # is a property of the day rather than of the diff.
      - run: cargo deny check licenses bans

  ui:
    name: the web UI
    # The only job that installs node (ticket 28): every other one builds the binary from the committed
    # `ui/dist`, which this job proves is the build of the committed sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version is the one `packageManager` in ui/package.json names.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Strict type checking, formatting, linting and unit tests
        run: make check-ui
      - name: The bundle stays within its budget, grammars lazy
        run: make check-ui-size
      - name: The committed ui/dist is the build of the committed sources
        run: |
          if [ -n "$(git status --porcelain -- ui/dist)" ]; then
            git status --short -- ui/dist >&2
            echo "ui/dist is stale: run make ui and commit the result" >&2
            exit 1
          fi
