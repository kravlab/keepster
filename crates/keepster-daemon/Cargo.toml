[package]
name = "keepster-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "keepster_daemon"
path = "src/lib.rs"

# One shipped binary: the daemon and the CLI are one artifact, and this crate owns it because
# ticket 08 makes it the wiring crate. `keepster-cli` stays a library with no store dependency.
[[bin]]
name = "keepster"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
jiff = "0.2.37"
keepster-api.workspace = true
keepster-app.workspace = true
keepster-cli.workspace = true
keepster-core.workspace = true
keepster-service.workspace = true
keepster-store.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tracing = "0.1.44"

[build-dependencies]
vergen-gitcl = { version = "1.0.8", features = ["build"] }

[dev-dependencies]
keepster-api.workspace = true
keepster-testkit.workspace = true
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
